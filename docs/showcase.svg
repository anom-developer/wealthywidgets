<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="wwFrameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

      /* Ticker continuous marquee animation */
      @keyframes marqueeLeft {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .ticker-strip {
        animation: marqueeLeft 18s linear infinite;
      }
      .ticker-strip:hover {
        animation-play-state: paused;
      }

      /* Sparkline drawing animation */
      @keyframes dashAnim {
        0% { stroke-dashoffset: 600; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      .sparkline-path {
        stroke-dasharray: 600;
        animation: dashAnim 4s ease-in-out infinite alternate;
      }

      /* Live Pulse Dot */
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.4; }
      }
      .beacon {
        transform-origin: 395px 230px;
        animation: pulseDot 1.8s infinite ease-in-out;
      }

      /* Sun rotation */
      @keyframes sunRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spinning-sun {
        transform-origin: 520px 200px;
        animation: sunRotate 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="15" y="15" width="850" height="350" rx="16" fill="url(#wwFrameBg)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Window Header -->
  <path d="M 15 31 Q 15 15 31 15 L 849 15 Q 865 15 865 31 L 865 52 L 15 52 Z" fill="#0b0f19"/>
  <!-- Dots -->
  <circle cx="38" cy="34" r="5.5" fill="#ef4444"/>
  <circle cx="56" cy="34" r="5.5" fill="#f59e0b"/>
  <circle cx="74" cy="34" r="5.5" fill="#10b981"/>
  <text x="440" y="38" fill="#94a3b8" font-size="12" class="sans" text-anchor="middle" font-weight="500">wealthywidgets — Live Showcase &amp; Notion Embeds</text>

  <!-- 1. Live Ticker Bar (Top Strip) -->
  <g clip-path="url(#tickerClip)">
    <clipPath id="tickerClip">
      <rect x="16" y="53" width="848" height="34"/>
    </clipPath>
    <rect x="16" y="53" width="848" height="34" fill="#020617"/>
    <path d="M 16 87 L 864 87" stroke="#1e293b" stroke-width="1"/>

    <!-- Dual duplicate strip for infinite loop -->
    <g class="ticker-strip" transform="translate(0, 0)">
      <g class="mono" font-size="11" font-weight="600" fill="#cbd5e1">
        <!-- Item 1 -->
        <text x="30" y="74" fill="#38bdf8">✦ BTC</text>
        <text x="75" y="74">$68,420</text>
        <text x="135" y="74" fill="#10b981">+4.2%</text>

        <!-- Item 2 -->
        <text x="190" y="74" fill="#a855f7">✦ ETH</text>
        <text x="235" y="74">$3,450</text>
        <text x="285" y="74" fill="#10b981">+2.8%</text>

        <!-- Item 3 -->
        <text x="340" y="74" fill="#14b8a6">✦ SOL</text>
        <text x="382" y="74">$182.40</text>
        <text x="438" y="74" fill="#10b981">+6.1%</text>

        <!-- Item 4 -->
        <text x="495" y="74" fill="#eab308">✦ NVDA</text>
        <text x="548" y="74">$138.25</text>
        <text x="602" y="74" fill="#10b981">+3.4%</text>

        <!-- Item 5 -->
        <text x="660" y="74" fill="#f43f5e">✦ TSLA</text>
        <text x="708" y="74">$252.10</text>
        <text x="760" y="74" fill="#ef4444">-1.1%</text>

        <!-- DUPLICATE SET for seamless 50% loop -->
        <text x="830" y="74" fill="#38bdf8">✦ BTC</text>
        <text x="875" y="74">$68,420</text>
        <text x="935" y="74" fill="#10b981">+4.2%</text>

        <text x="990" y="74" fill="#a855f7">✦ ETH</text>
        <text x="1035" y="74">$3,450</text>
        <text x="1085" y="74" fill="#10b981">+2.8%</text>

        <text x="1140" y="74" fill="#14b8a6">✦ SOL</text>
        <text x="1182" y="74">$182.40</text>
        <text x="1238" y="74" fill="#10b981">+6.1%</text>

        <text x="1295" y="74" fill="#eab308">✦ NVDA</text>
        <text x="1348" y="74">$138.25</text>
        <text x="1402" y="74" fill="#10b981">+3.4%</text>

        <text x="1460" y="74" fill="#f43f5e">✦ TSLA</text>
        <text x="1508" y="74">$252.10</text>
        <text x="1560" y="74" fill="#ef4444">-1.1%</text>
      </g>
    </g>
  </g>

  <!-- 2. Left Widget: Live Finance Sparkline Card -->
  <g filter="url(#cardShadow)">
    <rect x="36" y="104" width="384" height="206" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
    
    <!-- Header -->
    <circle cx="58" cy="130" r="14" fill="#f59e0b"/>
    <text x="58" y="135" fill="#ffffff" font-size="14" font-weight="bold" class="sans" text-anchor="middle">₿</text>
    <text x="82" y="130" fill="#f8fafc" font-size="14" font-weight="bold" class="sans">Bitcoin</text>
    <text x="82" y="145" fill="#94a3b8" font-size="11" class="mono">BTC / USD · Binance Live</text>

    <!-- Live indicator badge -->
    <rect x="330" y="118" width="74" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
    <circle cx="342" cy="129" r="3.5" fill="#10b981"/>
    <text x="352" y="133" fill="#6ee7b7" font-size="10" font-weight="bold" class="sans">LIVE</text>

    <!-- Price -->
    <text x="58" y="180" fill="#ffffff" font-size="24" font-weight="800" class="sans">$68,420.50</text>
    <!-- Change Pill -->
    <rect x="210" y="162" width="76" height="22" rx="4" fill="#14532d"/>
    <text x="248" y="177" fill="#4ade80" font-size="11" font-weight="bold" class="mono" text-anchor="middle">▲ +4.24%</text>

    <!-- Interactive Neon SVG Sparkline -->
    <g filter="url(#neonPulse)">
      <path class="sparkline-path" d="M 58 260 Q 110 270 150 240 T 230 250 T 310 200 T 395 230" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Live Beacon Dot -->
    <circle class="beacon" cx="395" cy="230" r="4.5" fill="#34d399"/>
    
    <!-- Time ranges -->
    <text x="58" y="292" fill="#64748b" font-size="10" class="mono">1H   24H   7D   30D   1Y   ALL</text>
    <text x="395" y="292" fill="#94a3b8" font-size="10" class="mono" text-anchor="end">High: $69,120</text>
  </g>

  <!-- 3. Right Top Widget: Live Weather Widget -->
  <g filter="url(#cardShadow)">
    <rect x="440" y="104" width="200" height="206" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
    <text x="458" y="130" fill="#f8fafc" font-size="14" font-weight="bold" class="sans">Tokyo, JP</text>
    <text x="458" y="145" fill="#94a3b8" font-size="11" class="sans">Open-Meteo Live</text>

    <!-- Animated Sun Icon -->
    <g class="spinning-sun">
      <circle cx="520" cy="200" r="22" fill="url(#sunGrad)"/>
      <path d="M 520 166 L 520 172 M 520 228 L 520 234 M 486 200 L 492 200 M 548 200 L 554 200 M 496 176 L 500 180 M 540 220 L 544 224 M 496 224 L 500 220 M 540 180 L 544 176" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Temp -->
    <text x="578" y="208" fill="#ffffff" font-size="26" font-weight="800" class="sans">22°C</text>
    <text x="578" y="224" fill="#94a3b8" font-size="11" class="sans">Clear Sky</text>

    <!-- Forecast Bars -->
    <g fill="#64748b" font-size="9" class="mono" text-anchor="middle">
      <text x="466" y="280">MON</text>
      <text x="502" y="280">TUE</text>
      <text x="538" y="280">WED</text>
      <text x="574" y="280">THU</text>
      <text x="610" y="280">FRI</text>
    </g>
    <g fill="#38bdf8">
      <rect x="460" y="286" width="12" height="12" rx="2"/>
      <rect x="496" y="284" width="12" height="14" rx="2"/>
      <rect x="532" y="280" width="12" height="18" rx="2" fill="#f59e0b"/>
      <rect x="568" y="282" width="12" height="16" rx="2" fill="#f59e0b"/>
      <rect x="604" y="288" width="12" height="10" rx="2"/>
    </g>
  </g>

  <!-- 4. Right Bottom Widget: Zero-Build HTML Web Component Card -->
  <g filter="url(#cardShadow)">
    <rect x="658" y="104" width="188" height="206" rx="12" fill="#020617" stroke="#334155" stroke-width="1"/>
    
    <rect x="658" y="104" width="188" height="26" rx="12" fill="#0f172a"/>
    <text x="672" y="122" fill="#94a3b8" font-size="10" class="mono">index.html (Notion / Web)</text>

    <g class="mono" font-size="10">
      <text x="670" y="152" fill="#64748b">&lt;!-- Drop anywhere --&gt;</text>
      <text x="670" y="172">
        <tspan fill="#ec4899">&lt;wealthy-ticker</tspan>
      </text>
      <text x="682" y="190">
        <tspan fill="#38bdf8">symbols</tspan><tspan fill="#cbd5e1">=</tspan><tspan fill="#a6e3a1">"BTC,ETH"</tspan>
      </text>
      <text x="682" y="208">
        <tspan fill="#38bdf8">live</tspan><tspan fill="#cbd5e1">=</tspan><tspan fill="#a6e3a1">"true"</tspan><tspan fill="#ec4899">&gt;</tspan>
      </text>
      <text x="670" y="226" fill="#ec4899">&lt;/wealthy-ticker&gt;</text>

      <rect x="670" y="248" width="164" height="46" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="752" y="268" fill="#c084fc" font-size="10" font-weight="bold" class="sans" text-anchor="middle">⚡ Notion /embed Ready</text>
      <text x="752" y="282" fill="#94a3b8" font-size="9" class="sans" text-anchor="middle">Copy &amp; paste link in 3s</text>
    </g>
  </g>

  <!-- Bottom Badges Bar -->
  <g class="sans" font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="440" y="340">✦ Live Binance WebSocket/REST &nbsp;·&nbsp; ✦ Open-Meteo High-Res &nbsp;·&nbsp; ✦ Notion /embed &nbsp;·&nbsp; ✦ Web Components &amp; React</text>
  </g>
</svg>